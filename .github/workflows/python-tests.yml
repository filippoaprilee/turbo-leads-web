name: Python regression tests
on:
  push:
    branches: [main, v7-progress-resume-preferences, v8-durable-checkpoints]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile modules
        run: python -m compileall -q app.py web_backend.py turbo_scraper.py durable_storage.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
